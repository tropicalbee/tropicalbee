name: Refresh profile snapshots

on:
  schedule:
    # 18:30 UTC = 00:00 Asia/Kolkata (IST), every night.
    - cron: "30 18 * * *"
    # 06:30 UTC = 12:00 Asia/Kolkata; refresh only the register at noon.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    # Prevent a fork or a manual run on another branch from publishing.
    if: github.repository == 'tropicalbee/tropicalbee' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ghost-miner-kit
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Read the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check local profile links
        working-directory: .
        run: python scripts/check-profile.py

      - name: Check the house adventure
        working-directory: tropicalbee-halloween-banner-kit
        run: npm run check:game

      - name: Fetch and validate the public calendar
        if: github.event.schedule != '30 6 * * *'
        run: python source/fetch-calendar.py

      - name: Check routes and month labels
        run: npm run check

      - name: Check counter parsing and failure handling
        working-directory: .
        run: |
          python scripts/check-visitor-counter.py
          node scripts/check-visitor-label.mjs

      - name: Fetch the visitor snapshot
        working-directory: .
        run: python trespass-section-kit/source/fetch-visitors.py

      - name: Install the shared image renderer
        # Both renderers use the banner kit's pinned Sharp dependency.
        working-directory: tropicalbee-halloween-banner-kit
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Render the contribution animation
        if: github.event.schedule != '30 6 * * *'
        run: npm run render

      - name: Render the register with the saved count
        working-directory: .
        run: node trespass-section-kit/source/render-trespasses.mjs

      - name: Validate the assembled profile
        working-directory: .
        run: python scripts/check-profile.py

      - name: Save refreshed profile snapshots
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            ghost-miner-kit/data/calendar.json \
            ghost-miner-kit/data/mining-route.json \
            ghost-miner-kit/data/month-labels.json \
            ghost-miner-kit/assets/ghost-miner.gif \
            ghost-miner-kit/assets/ghost-miner-preview.png \
            ghost-miner-kit/assets/ghost-miner-preview.svg \
            trespass-section-kit/data/visitors.json \
            trespass-section-kit/assets/trespass-register.gif \
            trespass-section-kit/assets/trespass-register-preview.png \
            trespass-section-kit/assets/trespass-register.svg
          if git diff --cached --quiet; then
            echo "No profile snapshot changes to publish."
            exit 0
          fi
          git commit -m "chore(profile): refresh profile snapshots"
          git push origin "HEAD:${DEFAULT_BRANCH}"
